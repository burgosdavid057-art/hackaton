  - codigo: PAR-SET-03
    tipo: parada
    categoria: setup
    nombre: Espera de liberación de primera pieza
    alias: [liberacion, primera pieza, esperando calidad, aprobacion de muestra,
            visto bueno]

  # ── Mecánica ───────────────────────────────────────────────────────────────
