# Taxonomía de planta — Copiloto de Producción HACEB
#
# Inventada para arrancar sin bloquear el desarrollo. Es plausible para una
# planta de línea blanca, pero no es la de HACEB: cuando alguien de planta la
# revise, lo que hay que cambiar son los `alias`, no los nombres.
#
# Los alias son la parte que de verdad trabaja. El nombre canónico lo lee el
# gerente en el resumen; el alias es lo que el supervisor escribe a las 2 a.m.
# ("se trabó", "no llegó material", "R-02"). El fuzzy match acierta o falla ahí.
#
# 25 causas de parada · 15 de scrap · 5 de calidad. Ese tamaño es deliberado:
# con menos, todo cae en "otros"; con más, la misma parada se registra distinto
# según quién escriba y la recurrencia se diluye hasta volverse invisible.

lineas:
  - nombre: L1
    producto: Neveras
    estaciones:
      - {nombre: Conformado de lámina,      alias: [conformado, prensa, troqueladora, troquel]}
      - {nombre: Ensamble de gabinete,      alias: [gabinete, armado de gabinete]}
      - {nombre: Inyección de poliuretano,  alias: [poliuretano, PU, espuma, inyeccion, molde]}
      - {nombre: Circuito de refrigeración, alias: [circuito, refrigeracion, serpentin, condensador]}
      - {nombre: Carga de gas,              alias: [carga de gas, gas, refrigerante, R600]}
      - {nombre: Ensamble final,            alias: [ensamble final, final, acabado]}
      - {nombre: Prueba funcional,          alias: [prueba, banco de prueba, test, funcional]}
      - {nombre: Empaque,                   alias: [empaque, embalaje, encajado]}

  - nombre: L2
    producto: Lavadoras
    estaciones:
      - {nombre: Conformado de gabinete,    alias: [conformado, prensa, lamina]}
      - {nombre: Remachado,                 alias: [remachadora, remach, R-02, remaches]}
      - {nombre: Ensamble de tina,          alias: [tina, tanque, canasta]}
      - {nombre: Montaje de transmisión,    alias: [transmision, motor, moto-reductor, polea]}
      - {nombre: Panel de control,          alias: [panel, tarjeta, control, display]}
      - {nombre: Prueba funcional,          alias: [prueba, banco, ciclo de prueba]}
      - {nombre: Empaque,                   alias: [empaque, embalaje]}

  - nombre: L3
    producto: Estufas y cocinas
    estaciones:
      - {nombre: Conformado,                alias: [conformado, prensa, corte]}
      - {nombre: Porcelanizado,             alias: [porcelanizado, esmalte, esmaltado, horno de esmalte]}
      - {nombre: Ensamble de quemadores,    alias: [quemadores, mecheros, parrilla]}
      - {nombre: Montaje de horno,          alias: [horno, cavidad]}
      - {nombre: Prueba de estanqueidad,    alias: [estanqueidad, prueba de gas, fugas, hermeticidad]}
      - {nombre: Empaque,                   alias: [empaque, embalaje]}

  - nombre: L4
    producto: Congeladores horizontales
    estaciones:
      - {nombre: Conformado de lámina,      alias: [conformado, prensa]}
      - {nombre: Inyección de poliuretano,  alias: [poliuretano, PU, espuma]}
      - {nombre: Circuito de refrigeración, alias: [circuito, refrigeracion]}
      - {nombre: Ensamble final,            alias: [ensamble, final]}
      - {nombre: Empaque,                   alias: [empaque]}

# ─────────────────────────────────────────────────────────────────────────────
# CAUSAS DE PARADA (25)
# ─────────────────────────────────────────────────────────────────────────────
causas:
  # ── Material y abastecimiento ──────────────────────────────────────────────
  - codigo: PAR-MAT-01
    tipo: parada
    categoria: material
    nombre: Falta de material en línea
    alias: [sin material, falto material, no llego material, desabasto, sin insumo,
            no hay pieza, esperando material, falta componente]

  - codigo: PAR-MAT-02
    tipo: parada
    categoria: material
    nombre: Material no conforme de proveedor
    alias: [material malo, lamina defectuosa, componente malo, no conforme,
            material fuera de medida, llego mal el material]

  - codigo: PAR-MAT-03
    tipo: parada
    categoria: material
    nombre: Error de surtido o material equivocado
    alias: [material equivocado, surtido mal, pieza cambiada, referencia equivocada,
            mandaron otra pieza]

  - codigo: PAR-LOG-01
    tipo: parada
    categoria: material
    nombre: Espera de logística interna
    alias: [montacargas, espera logistica, no hay estiba, no llego la estiba,
            estiba, sin canastilla, esperando el montacargas, no vino a recoger]

  # ── Cambio de referencia y ajuste ──────────────────────────────────────────
  - codigo: PAR-SET-01
    tipo: parada
    categoria: setup
    nombre: Cambio de referencia
    alias: [cambio de referencia, setup, cambio de modelo, montaje, cambio de producto,
